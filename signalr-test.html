<!DOCTYPE html>
<html>
<head>
    <title>SignalR Test</title>
</head>
<body>
    <h3>SignalR Test</h3>

    <input id="userId" placeholder="UserId" style="width:400px" />
    <br />
    <input id="conversationId" placeholder="ConversationId" style="width:400px" />
    <button onclick="connect()">Connect</button>

    <br /><br />
    <button onclick="startTyping()">Start Typing</button>
    <button onclick="stopTyping()">Stop Typing</button>

    <pre id="log"></pre>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>

    <script>
        let connection;

        function log(message) {
            console.log(message);
            document.getElementById("log").textContent += message + "\n";
        }

        window.connect = async function () {
            try {
                const userId = document.getElementById("userId").value;
                const conversationId = document.getElementById("conversationId").value;

                log("Connecting to hub...");

                connection = new signalR.HubConnectionBuilder()
                    .withUrl("http://localhost:5113/hubs/chat")
                    .configureLogging(signalR.LogLevel.Information)
                    .withAutomaticReconnect()
                    .build();

                registerHandlers();

                await connection.start();
                log("Connected. ConnectionId: " + connection.connectionId);

                await connection.invoke("RegisterUser", userId);
                log("Registered user: " + userId);

                await connection.invoke("JoinConversation", conversationId);
                log("Joined conversation: " + conversationId);
            }
            catch (err) {
                log("ERROR:");
                log(err.toString());
                console.error(err);
            }
        }

        function registerHandlers() {
            connection.on("presence.registered", data => {
                log("PRESENCE REGISTERED:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("presence.offline", data => {
                log("PRESENCE OFFLINE:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("conversation.joined", data => {
                log("CONVERSATION JOINED:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("conversation.updated", data => {
                log("CONVERSATION UPDATED:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("conversation.read", data => {
                log("CONVERSATION READ:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("message.received", async message => {
                log("MESSAGE RECEIVED:");
                log(JSON.stringify(message, null, 2));

                const userId = document.getElementById("userId").value;

                await connection.invoke("AcknowledgeDelivered", message.id, userId);
                log("Delivered ACK sent for message: " + message.id);

                await connection.invoke("AcknowledgeSeen", message.id, userId);
                log("Seen ACK sent for message: " + message.id);
            });

            connection.on("message.delivered.ack", data => {
                log("DELIVERED ACK CONFIRMED:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("message.seen.ack", data => {
                log("SEEN ACK CONFIRMED:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("message.delivered", data => {
                log("MESSAGE DELIVERED EVENT:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("message.seen", data => {
                log("MESSAGE SEEN EVENT:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("typing.started", data => {
                log("TYPING STARTED:");
                log(JSON.stringify(data, null, 2));
            });

            connection.on("typing.stopped", data => {
                log("TYPING STOPPED:");
                log(JSON.stringify(data, null, 2));
            });
        }

        window.startTyping = async function () {
            if (!connection) {
                log("Connection is not started.");
                return;
            }

            const conversationId = document.getElementById("conversationId").value;
            const userId = document.getElementById("userId").value;

            await connection.invoke("StartTyping", conversationId, userId);
            log("StartTyping sent");
        }

        window.stopTyping = async function () {
            if (!connection) {
                log("Connection is not started.");
                return;
            }

            const conversationId = document.getElementById("conversationId").value;
            const userId = document.getElementById("userId").value;

            await connection.invoke("StopTyping", conversationId, userId);
            log("StopTyping sent");
        }
    </script>
</body>
</html>
