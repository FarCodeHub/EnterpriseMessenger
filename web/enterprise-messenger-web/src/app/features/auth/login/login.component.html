<div class="min-h-screen bg-slate-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-2xl bg-white/10 border border-white/10 shadow-2xl p-8">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-white">
        EnterpriseMessenger
      </h1>
      <p class="mt-2 text-sm text-slate-300">
        Sign in to continue
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-200 mb-2">
          Username
        </label>

        <input
          type="text"
          formControlName="userName"
          autocomplete="username"
          class="w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-white outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
          placeholder="admin"
        />

        @if (form.controls.userName.touched && form.controls.userName.invalid) {
          <p class="mt-2 text-sm text-red-400">
            Username is required.
          </p>
        }
      </div>

      @if (errorMessage()) {
        <div class="rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300">
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isLoading()) {
          Signing in...
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</div>
