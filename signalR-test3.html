<!DOCTYPE html>
<html>
<head>
    <title>SignalR Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
</head>
<body>

<input id="token" placeholder="JWT Token" style="width:600px" />
<button onclick="connect()">Connect</button>

<script>
    async function connect() {

        const token = document.getElementById("token").value;

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:8080/hubs/chat", {
                accessTokenFactory: () => token
            })
            .withAutomaticReconnect()
            .build();

        connection.onclose(err => {
            console.log("Disconnected", err);
        });

        connection.onreconnecting(err => {
            console.log("Reconnecting", err);
        });

        connection.onreconnected(id => {
            console.log("Reconnected", id);
        });

        connection.on("message.created", message => {
    console.log("message.created", message);
 });

     connection.on("conversation.updated", data => {
    console.log("conversation.updated", data);

    
});



connection.on("presence.online", userId => {
    console.log("presence.online", userId);
});

connection.on("presence.offline", userId => {
    console.log("presence.offline", userId);
});

connection.on("notification.requested", notification => {
    console.log("notification.requested", notification);
});

connection.on("message.edited", message => {
    console.log("message.edited", message);
});

connection.on("message.deleted", message => {
    console.log("message.deleted", message);
});

        try {
            await connection.start();

            console.log("Connected");

            const conversationId = prompt("ConversationId:");

await connection.invoke("JoinConversation", conversationId);

console.log("Joined conversation", conversationId);
        }
        catch (err) {
            console.error(err);
        }
    }
</script>

</body>
</html>
