services:
  postgres:
    image: postgres:17
    container_name: enterprise-messenger-postgres
    environment:
      POSTGRES_DB: enterprise_messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - enterprise_messenger_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: enterprise-messenger-redis
    ports:
      - "6379:6379"  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: enterprise-messenger-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - enterprise_messenger_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
  minio:
    image: minio/minio
    container_name: enterprise-messenger-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - enterprise_messenger_minio_data:/data
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: enterprise-messenger-keycloak
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_HTTP_RELATIVE_PATH: /sso
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-messenger.json:/opt/keycloak/data/import/realm-messenger.json:ro
volumes:
  enterprise_messenger_postgres_data:
  enterprise_messenger_redis_data:
  enterprise_messenger_rabbitmq_data:
  enterprise_messenger_minio_data: