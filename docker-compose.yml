# Local development dependencies. A separate compose project from docker-compose.production.yml
# (different project name, container names and volumes), so the two never replace each other's containers.
# They publish some of the same host ports, so stop one stack before starting the other.
name: enterprise-messenger-dev

services:
  postgres:
    image: postgres:17
    container_name: enterprise-messenger-dev-postgres
    environment:
      POSTGRES_DB: enterprise_messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - enterprise_messenger_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: enterprise-messenger-dev-redis
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: enterprise-messenger-dev-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - enterprise_messenger_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
  minio:
    image: minio/minio
    container_name: enterprise-messenger-dev-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - enterprise_messenger_minio_data:/data
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: enterprise-messenger-dev-keycloak
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_HTTP_RELATIVE_PATH: /sso
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-messenger.json:/opt/keycloak/data/import/realm-messenger.json:ro
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: enterprise-messenger-dev-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - enterprise_messenger_opensearch_data:/usr/share/opensearch/data
  # Observability: the API pushes traces to Jaeger and metrics to Prometheus over OTLP; Grafana shows both.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: enterprise-messenger-dev-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - enterprise_messenger_prometheus_data:/prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    container_name: enterprise-messenger-dev-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    container_name: enterprise-messenger-dev-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - enterprise_messenger_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped
volumes:
  enterprise_messenger_postgres_data:
  enterprise_messenger_redis_data:
  enterprise_messenger_rabbitmq_data:
  enterprise_messenger_minio_data:
  enterprise_messenger_opensearch_data:
  enterprise_messenger_prometheus_data:
  enterprise_messenger_grafana_data:
