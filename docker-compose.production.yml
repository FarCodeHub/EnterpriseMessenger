services:
  postgres:
    image: postgres:15
    container_name: enterprise-messenger-postgres
    environment:
      POSTGRES_DB: enterprise_messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger_password
    ports:
      - "15432:5432"
    volumes:
      - enterprise_messenger_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: enterprise-messenger-redis
    ports:
      - "6379:6379"
    volumes:
      - enterprise_messenger_redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: enterprise-messenger-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: messenger
      RABBITMQ_DEFAULT_PASS: messenger_password
    volumes:
      - enterprise_messenger_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: enterprise-messenger-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    command: server /data --console-address ":9001"
    volumes:
      - enterprise_messenger_minio_data:/data
    restart: unless-stopped

  messenger-api:
    image: enterprise-messenger-api:latest
    container_name: enterprise-messenger-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__MessengerDb: Host=postgres;Port=5432;Database=enterprise_messenger;Username=messenger;Password=messenger_password

      Redis__ConnectionString: redis:6379

      RabbitMq__Host: rabbitmq
      RabbitMq__Username: messenger
      RabbitMq__Password: messenger_password

      Minio__Endpoint: minio:9000
      Minio__AccessKey: minioadmin
      Minio__SecretKey: minioadmin_password
      Minio__BucketName: messenger-files
      Minio__UseSsl: false
    
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio

    


volumes:
  enterprise_messenger_postgres_data:
  enterprise_messenger_redis_data:
  enterprise_messenger_rabbitmq_data:
  enterprise_messenger_minio_data: